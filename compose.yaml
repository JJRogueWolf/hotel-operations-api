services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotel_app
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in .env}
      POSTGRES_DB: hotel_operations
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_app -d hotel_operations"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: &app_environment
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: hotel_operations
      DB_USER: hotel_app
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in .env}
      MIGRATION_DB_USER: hotel_app
      MIGRATION_DB_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *app_environment
      AUTH_USERNAME: ${AUTH_USERNAME:?Set AUTH_USERNAME in .env}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?Set AUTH_PASSWORD_HASH in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data: